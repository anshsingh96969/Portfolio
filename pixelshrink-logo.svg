<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 43" role="img" aria-label="PixelShrink">
  <title>PixelShrink</title>
  <defs>
    <linearGradient id="ps-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a4fe6"/>
      <stop offset="1" stop-color="#e45eae"/>
    </linearGradient>
    <linearGradient id="ps-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="ps-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff"/>
      <path transform="translate(1.5 12.5) scale(0.5)" d="M148 72 C146 56 122 52 112 62 C100 74 108 86 124 94 C142 102 152 114 142 130 C132 146 106 146 94 132" fill="none" stroke="#000" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="64" cy="50" r="5" fill="#000"/>
    </mask>
  </defs>

  <!-- Badge -->
  <g transform="scale(0.43)">
    <rect width="100" height="100" rx="26" fill="url(#ps-grad)"/>
    <rect width="100" height="100" rx="26" fill="url(#ps-gloss)"/>
    <path mask="url(#ps-cut)" d="M30 23 H49 A16.5 16.5 0 0 1 49 56 H30 M30 23 V79" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path transform="translate(1.5 12.5) scale(0.5)" d="M148 72 C146 56 122 52 112 62 C100 74 108 86 124 94 C142 102 152 114 142 130 C132 146 106 146 94 132" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="79" y="35" width="7" height="7" rx="1.8" fill="#fff" fill-opacity="0.9"/>
    <rect x="87" y="27" width="5" height="5" rx="1.3" fill="#fff" fill-opacity="0.65"/>
  </g>

  <!-- Wordmark -->
  <text x="57" y="30" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="-0.8" fill="#20213a">PixelShrink</text>
</svg>
